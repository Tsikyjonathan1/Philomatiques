<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion – Association Philomatique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .login-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.10);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo i {
            font-size: 48px;
            color: #a37e4c;
            background: #fdfaf6;
            padding: 20px;
            border-radius: 50%;
            border: 1px solid #e2e8f0;
        }
        .login-logo h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 24px;
            color: #1e1e2a;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }
        .login-logo p {
            color: #7a7a8e;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #a37e4c;
            box-shadow: 0 0 0 3px rgba(163, 126, 76, 0.12);
            background: #ffffff;
        }
        .form-group input::placeholder {
            color: #a0aec0;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1e1e2a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #a37e4c;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login i {
            font-size: 18px;
        }
        .error-message {
            margin-top: 16px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .error-message.show {
            display: flex;
        }
        .error-message i {
            font-size: 16px;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }
        .login-footer a {
            color: #a37e4c;
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        /* Spinner pour le bouton */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn-login.loading .spinner {
            display: inline-block;
        }
        .btn-login.loading .btn-text {
            display: none;
        }
        .btn-login.loading i {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-book-open"></i>
            <h1>Association Philomatique</h1>
            <p>Administration</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="Entrez votre nom" required />
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Entrez votre mot de passe" required />
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i>
                <span class="btn-text">Se connecter</span>
                <span class="spinner"></span>
            </button>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Identifiants incorrects.</span>
            </div>
        </form>

        <div class="login-footer">
            Accès réservé à l'administration
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');

            // Réinitialiser
            errorMsg.classList.remove('show');

            if (!username || !password) {
                errorText.textContent = 'Veuillez remplir tous les champs.';
                errorMsg.classList.add('show');
                return;
            }

            // Désactiver le bouton et afficher le spinner
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Rediriger vers le dashboard
                    window.location.href = result.redirect || '/dashboard';
                } else {
                    errorText.textContent = result.error || 'Identifiants incorrects.';
                    errorMsg.classList.add('show');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error('Erreur:', err);
                errorText.textContent = 'Erreur réseau. Veuillez réessayer.';
                errorMsg.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
